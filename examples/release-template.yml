# ─────────────────────────────────────────────────────────────────────────────
# release-template.yml — шаблон релізного workflow для репозиторію застосунку
# ─────────────────────────────────────────────────────────────────────────────
#
# ВИКОРИСТАННЯ
#   1. Скопіюй цей файл у .github/workflows/release.yml репозиторію застосунку.
#   2. Зміни APP_NAME (ім'я exe без розширення) — єдине обов'язкове місце.
#   3. Заміни TODO-блоки: збірка і шлях до зібраного exe.
#   Решта готова до роботи.
#
# ЩО ВІДБУВАЄТЬСЯ ПРИ ЗАПУСКУ
#   push тегу v*  →  версія тегу = версія проєкту  →  збірка  →
#   →  <APP_NAME>-v<версія>-x64.exe + сайдкар .sha256  →  GitHub Release
#
# А далі — НІЧОГО. Bucket оновлюється сам: його Excavator читає `checkver` і
# `autoupdate` в bucket/<app>.json, знаходить новий Release, бере хеш із сайдкара
# й комітить. Жодного repository_dispatch, жодного PAT у секретах застосунку.
# Запуск Excavator — кнопкою в bucket (Actions → Excavator → Run workflow) або
# добовим розкладом. Докладно: DEVELOPMENT.md → «Як додати новий застосунок».
#
# ФОРМА АРТЕФАКТУ
#   Голий exe, без ZIP: bucket перейменовує його фрагментом `#/<APP_NAME>.exe`,
#   тож `bin` і `shortcuts` у маніфесті стабільні між версіями. Сайдкар —
#   рядок `<hex64> *<ім'я файлу>` (формат sha256sum): це один із двох форматів,
#   які scoop читає з `autoupdate.hash.url` без додаткових налаштувань.
#
# PRE-RELEASE
#   Тег із суфіксом після дефіса (v1.2.3-rc.1, -beta) позначається pre-release.
#   `checkver: github` дивиться лише на releases/latest, тож такий реліз bucket
#   не побачить — це спосіб прогнати ланцюг без наслідків для користувачів.
#   Версія звіряється без суфікса: тег v1.2.3-rc.1 вимагає версії проєкту 1.2.3.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # gh release create

env:
  # ─── ЄДИНЕ МІСЦЕ, ДЕ ТРЕБА ЗМІНИТИ ІМ'Я ──────────────────────────────────
  # Регістр важливий: це ім'я exe і половина імені артефакту.
  APP_NAME: MyApp
  # ──────────────────────────────────────────────────────────────────────────

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Тег — єдине твердження про версію, яке додає реліз. Звіряємо його з
      # версією в проєкті ДО збірки, щоб помилка коштувала секунди, не хвилини.
      - name: Gate — the tag names the project version
        run: |
          $tag = '${{ github.ref_name }}'
          $version = ($tag.TrimStart('v') -split '-', 2)[0]

          # ── TODO: прочитай версію проєкту зі свого джерела правди ─────────
          # Rust:   $project = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
          #                     Select-Object -First 1).Matches[0].Groups[1].Value
          # Node:   $project = (Get-Content package.json | ConvertFrom-Json).version
          # Go:     $project = (Get-Content VERSION -Raw).Trim()
          $project = $version
          # ────────────────────────────────────────────────────────────────────

          if ($project -ne $version) { throw "project version '$project' does not match tag '$tag'" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET=$env:APP_NAME-$tag-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRERELEASE=$($tag.Contains('-'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ── ЗБІРКА ───────────────────────────────────────────────────────────────
      # TODO: додай сюди кроки збірки свого застосунку.
      #
      # Приклад для Rust:
      #
      #   - name: Build
      #     run: cargo build --release --locked
      #
      # Приклад для Go:
      #
      #   - name: Set up Go
      #     uses: actions/setup-go@v5
      #     with:
      #       go-version-file: go.mod
      #   - name: Build
      #     run: go build -ldflags "-s -w -H windowsgui" -o "$env:APP_NAME.exe" .
      #
      # Приклад для Tauri (Node + Rust):
      #
      #   - uses: pnpm/action-setup@v4
      #   - uses: actions/setup-node@v5
      #     with:
      #       node-version: 'lts/*'
      #   - run: pnpm install --frozen-lockfile
      #   - run: pnpm tauri build --no-bundle
      # ─────────────────────────────────────────────────────────────────────────

      - name: Stage the artifact
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # ── TODO: шлях до зібраного exe ─────────────────────────────────────
          # Rust:  target\release\$env:APP_NAME.exe
          # Go:    $env:APP_NAME.exe
          Copy-Item "target\release\$env:APP_NAME.exe" "artifacts\$env:ASSET"
          # ────────────────────────────────────────────────────────────────────
          Get-Item "artifacts\$env:ASSET" | Format-List Name, Length

      # Сайдкар пишеться після всіх перевірок: провалений прогін не лишає хешу
      # для файлу, який нікому не слід ставити.
      - name: Write the SHA-256 sidecar
        run: |
          $hash = (Get-FileHash "artifacts\$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$env:ASSET" | Out-File -FilePath "artifacts\$env:ASSET.sha256" -Encoding ascii -NoNewline
          Get-Content "artifacts\$env:ASSET.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            'release', 'create', '${{ github.ref_name }}',
            "artifacts\$env:ASSET", "artifacts\$env:ASSET.sha256",
            '--verify-tag',
            '--title', "$env:APP_NAME ${{ github.ref_name }}",
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'True') { $ghArgs += '--prerelease' }
          gh @ghArgs
