name: Excavator

# Оновлює маніфести в bucket/ самотужки: читає checkver у кожному з них, дивиться
# сторінку релізів застосунку, і якщо там новіша версія — підтягує хеш за autoupdate,
# переписує маніфест і комітить. Живе в цьому репозиторії й редагує цей же репозиторій,
# тож йому вистачає власного github.token — жодних PAT ні тут, ні в репозиторіях
# застосунків.
#
# Два тригери, і порядок тут навмисний:
#
#   workflow_dispatch — основний шлях. Випустили реліз, перевірили його, натиснули
#                       кнопку. Нічого не рухається без вашого відома.
#   schedule          — запобіжник раз на добу, на випадок якщо кнопку забули. Шаблон
#                       ScoopInstaller/BucketTemplate ходить кожні 4 години; тут добово,
#                       бо кнопка вже покриває випадок «треба зараз», а розклад лишається
#                       тільки як сітка під ним.
#
# 04:20 UTC — це ранок за київським часом, тож результат нічного запуску видно на
# початку дня. Хвилина 20, а не 00: GitHub попереджає, що на початку години черга
# запланованих завдань перевантажена й запуск відкладається.
#
# Чого excavator НЕ вміє: створити маніфест, якого ще нема. Він тільки оновлює наявні,
# тож перше засівання bucket/<app>.json робиться руками.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          # Помилка checkver валить запуск замість тихого зеленого прапорця. Для ручного
          # запуску це головне: ви натиснули кнопку саме щоб дізнатися результат, і
          # «зелено, але нічого не оновилося» — найгірша з можливих відповідей.
          THROW_ERROR: 1
          # SKIP_UPDATED навмисно НЕ вмикаємо, на відміну від шаблону. Він прибирає з логу
          # рядки про застосунки, які вже актуальні — а саме вони й відповідають на
          # питання «чи він узагалі побачив мій застосунок?». На шести маніфестах повний
          # лог короткий, і ця відповідь варта кількох зайвих рядків.
