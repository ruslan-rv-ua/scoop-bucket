name: Set a manifest by hand (override)

# Ручний важіль на випадок, коли Excavator не підходить: виставити конкретному
# застосунку конкретну версію, URL і хеш.
#
# Звичайний шлях — це excavator.yml. Він сам читає checkver і autoupdate у
# маніфесті й знаходить новий реліз. Цей воркфлоу потрібен тоді, коли треба
# обійти цю логіку: відкотити маніфест на попередню версію, поставити реліз, який
# checkver не бачить, або полагодити хеш, не чекаючи наступного релізу.
#
# Схема роботи:
#   1. Приймає app / version / hash / url з форми запуску
#   2. Перевіряє що URL доступний і SHA256 збігається — до того як щось міняти
#   3. Оновлює маніфест bucket/{app}.json і пушить напряму в main
#   4. CI перевіряє структуру маніфесту; при помилці — автоматично робить revert
#
# Маніфест мусить УЖЕ ІСНУВАТИ: цей воркфлоу оновлює, але не створює.
#
# Тригер repository_dispatch прибрано разом із переходом на Excavator. Ним
# користувалися репозиторії застосунків, і для цього кожен тримав PAT із правом
# запису сюди. Запуск звідси не потребує жодного секрету — вистачає токена, який
# GitHub видає самому запуску.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App id (lowercase, наприклад: browserselector)'
        required: true
      version:
        description: 'Version (without v prefix, наприклад: 1.2.3)'
        required: true
      hash:
        description: 'SHA256 hash'
        required: true
      url:
        description: 'Download URL'
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    # Нормалізуємо вхідні дані через env — безпечна альтернатива
    # прямій інтерполяції ${{ }} у run-блоках (захист від ін'єкцій)
    env:
      APP:     ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      HASH:    ${{ inputs.hash }}
      URL:     ${{ inputs.url }}

    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check manifest exists
        run: |
          MANIFEST="bucket/$APP.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest '$MANIFEST' not found in bucket/"
            exit 1
          fi
          echo "Found: $MANIFEST"

      # Завантажуємо файл і порівнюємо SHA256 до того як щось змінювати.
      # Якщо URL недоступний або хеш не збігається — одразу падаємо з помилкою.
      - name: Verify URL and hash
        run: |
          TEMP=$(mktemp)

          # Маніфест може нести scoop-івський фрагмент '#/Name.exe', який перейменовує
          # завантажений файл. Це частина URL для scoop, але не для сервера — качаємо без
          # нього, а в маніфест нижче пишемо URL цілим, разом із фрагментом.
          DL_URL="${URL%%#*}"
          echo "Downloading: $DL_URL"

          HTTP_CODE=$(curl -fsSL --write-out "%{http_code}" -o "$TEMP" "$DL_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Download failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          ACTUAL_HASH=$(sha256sum "$TEMP" | awk '{print $1}')
          EXPECTED_HASH=$(echo "$HASH" | tr '[:upper:]' '[:lower:]')
          ACTUAL_HASH=$(echo "$ACTUAL_HASH" | tr '[:upper:]' '[:lower:]')

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: Hash mismatch!"
            echo "  Expected: $EXPECTED_HASH"
            echo "  Actual:   $ACTUAL_HASH"
            exit 1
          fi

          echo "✓ Hash verified: $ACTUAL_HASH"

      - name: Update manifest
        run: |
          MANIFEST="bucket/$APP.json"

          jq --arg version "$VERSION" \
             --arg hash    "$HASH" \
             --arg url     "$URL" \
             '.version = $version |
              .architecture."64bit".url  = $url |
              .architecture."64bit".hash = $hash' \
             "$MANIFEST" > "$MANIFEST.tmp"

          mv "$MANIFEST.tmp" "$MANIFEST"

          echo "Updated manifest:"
          cat "$MANIFEST"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "bucket/$APP.json"

          if git diff --staged --quiet; then
            echo "No changes — manifest is already at version $VERSION"
            exit 0
          fi

          git commit -m "Update $APP to $VERSION"
          git push origin main
